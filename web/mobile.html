<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agent" />
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)" />
  <title>Skald</title>
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/icons/icon-192.png" type="image/png" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />

  <script>
    (function () {
      // Same chain as the desktop shell: a saved choice wins over the OS.
      const saved = localStorage.getItem('theme');
      const dark  = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', e => {
          if (!localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
          }
        });
    })();
  </script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/setup-page.css" />
  <link rel="stylesheet" href="css/copilot-messages.css" />
  <link rel="stylesheet" href="css/agent-tasks.css" />
  <link rel="stylesheet" href="css/inbox-cards.css" />
  <link rel="stylesheet" href="css/file-viewer.css" />
  <link rel="stylesheet" href="css/mobile.css" />

  <script type="importmap">
  {
    "imports": {
      "lit":                           "/vendor/lit-all.min.js",
      "lit/directives/unsafe-html.js": "/vendor/lit-all.min.js",
      "lit/directives/keyed.js":       "/vendor/lit-all.min.js",
      "marked":                        "/vendor/marked.esm.js",
      "dompurify":                     "/vendor/purify.es.mjs"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    mobile-app { display: flex; flex-direction: column; height: 100%; }
  </style>
</head>
<body>
  <mobile-app id="mobile-app"></mobile-app>
  <login-page id="login-page" style="display:none"></login-page>

  <script>
    (function () {
      // Native shell handles auth in background — never gate it.
      if (new URLSearchParams(location.search).get('native') === 'true') return;

      var app   = document.getElementById('mobile-app');
      var login = document.getElementById('login-page');

      fetch('/api/auth/me').then(function (res) {
        if (res.ok) return;                       // logged in — show app
        app.style.display    = 'none';            // 401 — show login
        login.style.display  = '';
      }).catch(function () {
        app.style.display    = 'none';            // network error — show login
        login.style.display  = '';
      });
    })();
  </script>

  <script type="module" src="components/mobile-app.js"></script>
</body>
</html>
