[package]
name = "honcho-client"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest   = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tracing   = "0.1"
