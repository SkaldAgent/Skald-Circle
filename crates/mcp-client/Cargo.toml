[package]
name = "mcp-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio      = { version = "1", features = ["sync", "process", "io-util", "time", "rt", "macros"] }
reqwest    = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
tracing    = "0.1"
async-trait = "0.1"
base64     = "0.22"
